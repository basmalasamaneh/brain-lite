openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /spaces:
    get:
      operationId: listSpaces
      parameters:
        - {name: archived, in: query, schema: {type: boolean}}
      responses:
        "200":
          description: Owned spaces with confirmed membership counts
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SpacesList"}
    post:
      operationId: createSpace
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SpaceInput"}
      responses:
        "201":
          description: Created Space; existing memories queued for suggestions
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SpaceResult"}
  /spaces/suggestions:
    get:
      operationId: listSpaceSuggestions
      responses:
        "200":
          description: Repeated own entities with no existing Space; never auto-created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SpaceCreationSuggestions"}
  /spaces/suggestions/{id}/confirm:
    post:
      operationId: confirmSpaceSuggestion
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Confirmed Space
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SpaceResult"}
        "404": {description: Suggestion not owned}
        "409": {description: Dismissed suggestion is terminal}
  /spaces/suggestions/{id}/dismiss:
    post:
      operationId: dismissSpaceSuggestion
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "204": {description: Permanently dismissed}
        "404": {description: Suggestion not owned}
  /spaces/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getSpace
      responses:
        "200":
          description: Space overview, confirmed members only; deterministic profile with provenance
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SpaceDetail"}
        "404": {description: Space not owned}
    patch:
      operationId: updateSpace
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SpaceUpdate"}
      responses:
        "200":
          description: Updated Space
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SpaceResult"}
        "404": {description: Space not owned}
    delete:
      operationId: deleteSpace
      responses:
        "204": {description: Space deleted; original memories preserved}
        "404": {description: Space not owned}
  /spaces/{id}/memories:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listSpaceMemories
      parameters:
        - {name: filter, in: query, schema: {type: string, enum: [all, events, documents, tasks, notes, links]}}
      responses:
        "200":
          description: Confirmed timeline and pending AI memberships
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SpaceMemories"}
        "404": {description: Space not owned}
    post:
      operationId: addSpaceMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [memory_id]
              properties:
                memory_id: {type: integer, minimum: 1}
      responses:
        "204": {description: Confirmed manual membership}
        "404": {description: Space or memory not owned}
        "409": {description: Dismissed membership is terminal}
  /spaces/{id}/memories/{memoryId}:
    delete:
      operationId: dismissSpaceMemory
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: memoryId, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "204": {description: Membership terminally dismissed; original memory preserved}
        "404": {description: Space or memory not owned}
  /spaces/{id}/profile/{itemId}:
    delete:
      operationId: hideSpaceProfileItem
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: itemId, in: path, required: true, schema: {type: string}}
      responses:
        "204": {description: Derived item persistently hidden; original memory preserved}
        "404": {description: Space or profile item not owned}
  /memories/{id}/spaces:
    get:
      operationId: listMemorySpaces
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Confirmed Spaces for this owned memory
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemorySpaces"}
        "404": {description: Memory not owned}
  /memories/{id}/space-suggestions:
    get:
      operationId: listMemorySpaceSuggestions
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Efficient owned pending memberships, excluding archived Spaces
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemorySpaceSuggestions"}
        "404": {description: Memory not owned}
  /connections/suggestions:
    get:
      operationId: getConnectionSuggestions
      responses:
        "200":
          description: Pending owned connections
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConnectionSuggestions"}
  /memories/{id}/connections:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
    get:
      operationId: getMemoryConnections
      responses:
        "200":
          description: Confirmed and suggested owned connections
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemoryConnections"}
        "404": {description: Memory not found}
    post:
      operationId: createMemoryConnection
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateConnectionInput"}
      responses:
        "201":
          description: Manual confirmed connection
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConnectionResult"}
        "409": {description: Dismissed pairs are terminal}
  /connections/{id}/confirm:
    post:
      operationId: confirmConnection
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Confirmed connection
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConnectionResult"}
        "409": {description: Dismissed pairs are terminal}
  /connections/{id}/dismiss:
    post:
      operationId: dismissConnection
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Dismissed connection
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConnectionResult"}
  /connections/{id}:
    delete:
      operationId: removeConnection
      description: Sets dismissed permanently; does not remove the pair tombstone.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "204": {description: Dismissed}
  /connections/{id}/merge:
    post:
      operationId: mergeConnection
      description: Explicitly confirmed duplicate merge. Keeps selected memory content unchanged and transfers links.
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MergeConnectionInput"}
      responses:
        "200":
          description: Retained memory
          content:
            application/json:
              schema:
                type: object
                required: [memory]
                properties:
                  memory: {$ref: "#/components/schemas/Memory"}
        "409": {description: Not an active duplicate pair}
  /connections/settings:
    get:
      operationId: getConnectionSettings
      responses:
        "200":
          description: Connection preferences and confirmed count
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConnectionSettings"}
    patch:
      operationId: updateConnectionSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ConnectionSettingsInput"}
      responses:
        "200":
          description: Updated connection preferences
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ConnectionSettings"}
  /connections/discover:
    post:
      operationId: discoverConnections
      description: Queues a background scan immediately, including when automatic discovery is off.
      responses:
        "202":
          description: Background discovery queued
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued: {type: boolean, enum: [true]}
        "429": {description: AI request limit}
  /search/related:
    get:
      operationId: searchRelated
      description: User-scoped hybrid semantic search, top 8. Embeddings never returned.
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 2000}}
        - {name: type, in: query, schema: {type: string}}
        - {name: date_from, in: query, schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}}
        - {name: date_to, in: query, schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}}
      responses:
        "200":
          description: Related memories
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RelatedMemories"}
        "503": {description: Semantic provider unavailable; keyword results remain available}
  /memories/{id}/similar:
    get:
      operationId: getSimilarMemories
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Top 3 similar owned memories excluding this memory
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RelatedMemories"}
        "404": {description: Memory not found}
  /indexing/status:
    get:
      operationId: getIndexingStatus
      responses:
        "200":
          description: Current user's durable indexing progress
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IndexingStatus"}
  /indexing/reindex:
    post:
      operationId: reindexMemories
      responses:
        "200":
          description: Current user's memories queued again
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IndexingStatus"}
        "429": {description: Reindex rate limit}
  /voice/transcribe:
    post:
      operationId: transcribeVoice
      description: Same audio validation and limits as capture/voice. keep_recording must be false. No memory or file is created.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VoiceCaptureInput"}
      responses:
        "200":
          description: Verbatim transcript only
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VoiceTranscript"}
        "400": {description: Invalid input or keep_recording true}
        "413": {description: Audio too large or too long}
        "429": {description: Voice processing limit}
        "503": {description: Provider unavailable}
  /capture/voice:
    post:
      operationId: captureVoice
      description: Authenticated. Maximum 5 MiB decoded audio and 120 seconds. 30 AI captures per user per hour. Audio is discarded unless keep_recording is true.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VoiceCaptureInput"}
      responses:
        "201":
          description: Verbatim transcript and separately saved memories for distinct spoken items. Kept recordings have file_path and extra.attachment_kind="audio" plus extra.audio_mime_type; when not kept file_path is null.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VoiceCaptureResult"}
        "400": {description: "Invalid input, encoding or mismatched audio signature"}
        "401": {description: Sign in required}
        "413": {description: "Audio over 5 MiB, duration over 120 seconds or request too large"}
        "422": {description: Corrupt audio or no speech}
        "429": {description: Per-user AI rate limit or active capture}
        "503":
          description: Provider, extraction or storage failure. If words were recovered, transcript is present so the user can explicitly save a plain note.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VoiceCaptureError"}
  /capture/voice/plain:
    post:
      operationId: saveVoicePlainNote
      description: Opt-in plain note from a recovered or manually entered transcript; no AI and no audio upload.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VoicePlainInput"}
      responses:
        "201":
          description: Saved plain note
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Memory"}
        "400": {description: Missing or invalid text}
        "401": {description: Sign in required}
  /brain/ask:
    post:
      operationId: askBrain
      description: Authenticated; answers only from the user's memories. Returns 503 if the answer cannot be safely generated.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BrainQuestion"}
      responses:
        "200":
          description: Grounded answer and cited memories
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BrainAnswer"}
        "401": {description: Sign in required}
        "413": {description: Too many memories to fit in context}
        "503": {description: Answer generation unavailable or invalid}
  /brain/export:
    get:
      operationId: exportBrainData
      description: Downloads only the signed-in user's memories, uploads metadata, and profile; not account, sessions, tokens or third-party data.
      responses:
        "200":
          description: Personal data JSON attachment
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BrainExport"}
        "401": {description: Sign in required}
  /brain/data:
    delete:
      operationId: deleteBrainData
      description: Deletes only signed-in user's memories and owned uploads/files; retains account and login.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BrainDeletion"}
      responses:
        "200":
          description: Personal data deleted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BrainDeletionResult"}
        "400": {description: Confirmation required}
        "401": {description: Sign in required}
        "503": {description: Partial cleanup failed; retry safely}
  /memories:
    get:
      operationId: listMemories
      parameters:
        - {name: type, in: query, schema: {type: string}}
        - {name: search, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [confirmed, needs_review]}}
        - {name: date_from, in: query, schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}}
        - {name: date_to, in: query, schema: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}}
      responses:
        "200":
          description: Memories
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Memory"}}
    post:
      operationId: createMemory
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MemoryInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Memory"}
  /memories/samples:
    delete:
      operationId: deleteSampleMemories
      responses:
        "204": {description: Removed own sample memories}
  /memories/stats:
    get:
      operationId: getMemoryStats
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemoryStats"}
  /memories/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      operationId: getMemory
      responses:
        "200":
          description: Memory
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Memory"}
    patch:
      operationId: updateMemory
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MemoryUpdate"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Memory"}
    delete:
      operationId: deleteMemory
      responses:
        "204": {description: Deleted}
  /memories/{id}/calendar:
    get:
      operationId: downloadMemoryCalendar
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Calendar event
          content:
            text/calendar:
              schema: {type: string}
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UploadUrlRequest"}
      responses:
        "200":
          description: Upload URL
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UploadUrlResponse"}
  /auth/signup:
    post:
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SignUpInput"}
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthResult"}
  /auth/login:
    post:
      operationId: logIn
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginInput"}
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthResult"}
  /auth/logout:
    post:
      operationId: logOut
      responses:
        "204": {description: Signed out}
  /auth/me:
    get:
      operationId: getAuthMe
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthResult"}
        "401": {description: Sign in required}
  /auth/profile:
    patch:
      operationId: updateAuthProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfileInput"}
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthResult"}
  /auth/password:
    post:
      operationId: changeAuthPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasswordInput"}
      responses:
        "204": {description: Password changed}
  /auth/account:
    delete:
      operationId: deleteAuthAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AccountDeletionInput"}
      responses:
        "204": {description: Account and files deleted}
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    SpaceKind:
      type: string
      enum: [project, person, trip, topic]
    SpaceColor:
      type: string
      enum: [gold, amber, bronze, sand]
    SpaceIcon:
      type: string
      enum: [briefcase, user, plane, hash, heart, book, sparkles, map]
    SpaceInput:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind: {$ref: "#/components/schemas/SpaceKind"}
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: [string, "null"], maxLength: 2000}
        icon: {$ref: "#/components/schemas/SpaceIcon"}
        color: {$ref: "#/components/schemas/SpaceColor"}
        pinned: {type: boolean}
        archived: {type: boolean}
    SpaceUpdate:
      type: object
      additionalProperties: false
      properties:
        kind: {$ref: "#/components/schemas/SpaceKind"}
        name: {type: string, minLength: 1, maxLength: 120}
        description: {type: [string, "null"], maxLength: 2000}
        icon: {$ref: "#/components/schemas/SpaceIcon"}
        color: {$ref: "#/components/schemas/SpaceColor"}
        pinned: {type: boolean}
        archived: {type: boolean}
    Space:
      type: object
      required: [id, kind, name, description, icon, color, pinned, archived, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/SpaceKind"}
        name: {type: string}
        description: {type: [string, "null"]}
        icon: {$ref: "#/components/schemas/SpaceIcon"}
        color: {$ref: "#/components/schemas/SpaceColor"}
        pinned: {type: boolean}
        archived: {type: boolean}
        created_at: {type: string}
        updated_at: {type: string}
    SpaceWithCount:
      allOf:
        - {$ref: "#/components/schemas/Space"}
        - type: object
          required: [memory_count]
          properties:
            memory_count: {type: integer}
    SpacesList:
      type: object
      required: [spaces]
      properties:
        spaces: {type: array, items: {$ref: "#/components/schemas/SpaceWithCount"}}
    SpaceResult:
      type: object
      required: [space]
      properties:
        space: {$ref: "#/components/schemas/Space"}
    MemorySpaces:
      type: object
      required: [spaces]
      properties:
        spaces: {type: array, items: {$ref: "#/components/schemas/Space"}}
    SpaceCreationSuggestion:
      type: object
      required: [id, kind, name, reason]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: "#/components/schemas/SpaceKind"}
        name: {type: string}
        reason: {type: string}
    SpaceCreationSuggestions:
      type: object
      required: [suggestions]
      properties:
        suggestions: {type: array, items: {$ref: "#/components/schemas/SpaceCreationSuggestion"}}
    SpaceMemorySuggestion:
      type: object
      required: [memory, reason, confidence]
      properties:
        memory: {$ref: "#/components/schemas/Memory"}
        reason: {type: string}
        confidence: {type: integer, minimum: 75, maximum: 100}
    MemorySpaceSuggestion:
      type: object
      required: [space, reason, confidence]
      properties:
        space: {$ref: "#/components/schemas/Space"}
        reason: {type: string}
        confidence: {type: integer, minimum: 75, maximum: 100}
    MemorySpaceSuggestions:
      type: object
      required: [suggestions]
      properties:
        suggestions: {type: array, items: {$ref: "#/components/schemas/MemorySpaceSuggestion"}}
    SpaceMemories:
      type: object
      required: [memories, suggestions]
      properties:
        memories: {type: array, items: {$ref: "#/components/schemas/Memory"}}
        suggestions: {type: array, items: {$ref: "#/components/schemas/SpaceMemorySuggestion"}}
    SpaceProfileItem:
      type: object
      required: [id, kind, value, memory_id]
      properties:
        id: {type: string}
        kind: {type: string}
        value: {type: string}
        memory_id: {type: integer}
    SpaceProfile:
      type: [object, "null"]
      required: [last_interaction, items]
      properties:
        last_interaction: {type: [string, "null"], description: "Latest valid nonfuture event_date from confirmed members, original date/time preserved. Null if none; import/capture dates never imply an interaction."}
        items: {type: array, items: {$ref: "#/components/schemas/SpaceProfileItem"}}
    SpaceDetail:
      type: object
      required: [space, counts, upcoming, open_tasks, profile]
      properties:
        space: {$ref: "#/components/schemas/Space"}
        counts:
          type: object
          required: [memories, upcoming, tasks]
          properties:
            memories: {type: integer}
            upcoming: {type: integer}
            tasks: {type: integer}
        upcoming: {type: array, items: {$ref: "#/components/schemas/Memory"}}
        open_tasks: {type: array, items: {$ref: "#/components/schemas/Memory"}}
        profile: {$ref: "#/components/schemas/SpaceProfile"}
    MergeConnectionInput:
      type: object
      additionalProperties: false
      required: [keep_memory_id, confirm]
      properties:
        keep_memory_id: {type: integer, minimum: 1}
        confirm: {type: boolean, enum: [true]}
    ConnectionSettingsInput:
      type: object
      additionalProperties: false
      required: [automatic]
      properties:
        automatic: {type: boolean}
    ConnectionSuggestions:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items: {$ref: "#/components/schemas/Connection"}
    MemoryConnections:
      type: object
      required: [confirmed, suggested]
      properties:
        confirmed:
          type: array
          items: {$ref: "#/components/schemas/Connection"}
        suggested:
          type: array
          items: {$ref: "#/components/schemas/Connection"}
    ConnectionResult:
      type: object
      required: [connection]
      properties:
        connection: {$ref: "#/components/schemas/Connection"}
    ConnectionSettings:
      type: object
      required: [automatic, confirmed_count]
      properties:
        automatic: {type: boolean}
        confirmed_count: {type: integer, minimum: 0}
    RelationType:
      type: string
      enum: [same_event, same_person, same_project, same_topic, follow_up, duplicate, other]
    CreateConnectionInput:
      type: object
      additionalProperties: false
      required: [other_id]
      properties:
        other_id: {type: integer, minimum: 1}
        relation_type: {$ref: "#/components/schemas/RelationType"}
        reason: {type: string, maxLength: 1000}
    Connection:
      type: object
      required: [id, memory_a, memory_b, source, status, relation_type, reason, confidence, created_at, updated_at]
      properties:
        id: {type: integer}
        memory_a: {$ref: "#/components/schemas/Memory"}
        memory_b: {$ref: "#/components/schemas/Memory"}
        source: {type: string, enum: [ai, manual]}
        status: {type: string, enum: [suggested, confirmed, dismissed]}
        relation_type: {$ref: "#/components/schemas/RelationType"}
        reason: {type: string}
        confidence: {type: integer, minimum: 0, maximum: 100}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    VoiceTranscript:
      type: object
      required: [transcript]
      properties:
        transcript: {type: string}
    IndexingStatus:
      type: object
      required: [indexed, total, pending, failed, mode]
      properties:
        indexed: {type: integer}
        total: {type: integer}
        pending: {type: integer}
        failed: {type: integer, description: Failed attempts waiting for durable retry}
        mode: {type: string, enum: [pgvector, double_precision_array]}
    RelatedMemory:
      allOf:
        - {$ref: "#/components/schemas/Memory"}
        - type: object
          required: [relevance]
          properties:
            relevance: {type: number, minimum: 0, maximum: 1}
    AnswerSource:
      allOf:
        - {$ref: "#/components/schemas/Memory"}
        - type: object
          properties:
            relevance: {type: number, minimum: 0, maximum: 1}
    RelatedMemories:
      type: object
      required: [memories]
      properties:
        memories: {type: array, items: {$ref: "#/components/schemas/RelatedMemory"}}
    VoiceCaptureInput:
      type: object
      additionalProperties: false
      required: [audio_base64, mime_type, language, timezone]
      properties:
        audio_base64: {type: string, minLength: 4, maxLength: 6990508, description: "Canonical padded base64; decoded bytes must be at most 5242880."}
        mime_type: {type: string, description: "audio/webm, audio/ogg, audio/mp4, audio/mpeg or audio/wav; optional codecs parameter."}
        language: {type: string, enum: [en, ar]}
        timezone: {type: string, minLength: 1, maxLength: 100, description: "Valid IANA timezone."}
        keep_recording: {type: boolean, default: false}
        space_id: {type: string, format: uuid, description: Owned Space; capture and confirmed memberships commit atomically}
    VoiceCaptureResult:
      type: object
      required: [transcript, memories]
      properties:
        transcript: {type: string}
        memories: {type: array, minItems: 1, items: {$ref: "#/components/schemas/Memory"}}
    VoiceCaptureError:
      type: object
      required: [error, code]
      properties:
        error: {type: string}
        code: {type: string}
        transcript: {type: string, description: "Only when speech was recovered; explicit user opt-in is required to save."}
    VoicePlainInput:
      type: object
      additionalProperties: false
      required: [transcript, language]
      properties:
        transcript: {type: string, minLength: 1, maxLength: 100000}
        language: {type: string, enum: [en, ar]}
        space_id: {type: string, format: uuid}
    BrainQuestion:
      type: object
      additionalProperties: false
      required: [question, language]
      properties:
        question: {type: string, minLength: 1, maxLength: 2000}
        space_id: {type: string, format: uuid, description: Restrict semantic/exact retrieval and SQL totals to confirmed members; permitted confirmed one-hop connections may expand context}
        language: {type: string, enum: [en, ar]}
        timezone: {type: string, minLength: 1, maxLength: 100, default: UTC, description: "Validated IANA timezone for local calendar ranges; defaults to UTC for older clients."}
    BrainAnswer:
      type: object
      required: [answer, source_ids, sources]
      properties:
        answer: {type: string}
        source_ids: {type: array, items: {type: integer}}
