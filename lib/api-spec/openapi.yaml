openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /capture/voice:
    post:
      operationId: captureVoice
      description: Authenticated. Maximum 5 MiB decoded audio and 120 seconds. 30 AI captures per user per hour. Audio is discarded unless keep_recording is true.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VoiceCaptureInput"}
      responses:
        "201":
          description: Verbatim transcript and separately saved memories for distinct spoken items. Kept recordings have file_path and extra.attachment_kind="audio" plus extra.audio_mime_type; when not kept file_path is null.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VoiceCaptureResult"}
        "400": {description: "Invalid input, encoding or mismatched audio signature"}
        "401": {description: Sign in required}
        "413": {description: "Audio over 5 MiB, duration over 120 seconds or request too large"}
        "422": {description: Corrupt audio or no speech}
        "429": {description: Per-user AI rate limit or active capture}
        "503":
          description: Provider, extraction or storage failure. If words were recovered, transcript is present so the user can explicitly save a plain note.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/VoiceCaptureError"}
  /capture/voice/plain:
    post:
      operationId: saveVoicePlainNote
      description: Opt-in plain note from a recovered or manually entered transcript; no AI and no audio upload.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VoicePlainInput"}
      responses:
        "201":
          description: Saved plain note
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Memory"}
        "400": {description: Missing or invalid text}
        "401": {description: Sign in required}
  /brain/ask:
    post:
      operationId: askBrain
      description: Authenticated; answers only from the user's memories. Returns 503 if the answer cannot be safely generated.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BrainQuestion"}
      responses:
        "200":
          description: Grounded answer and cited memories
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BrainAnswer"}
        "401": {description: Sign in required}
        "413": {description: Too many memories to fit in context}
        "503": {description: Answer generation unavailable or invalid}
  /brain/export:
    get:
      operationId: exportBrainData
      description: Downloads only the signed-in user's memories, uploads metadata, and profile; not account, sessions, tokens or third-party data.
      responses:
        "200":
          description: Personal data JSON attachment
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BrainExport"}
        "401": {description: Sign in required}
  /brain/data:
    delete:
      operationId: deleteBrainData
      description: Deletes only signed-in user's memories and owned uploads/files; retains account and login.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BrainDeletion"}
      responses:
        "200":
          description: Personal data deleted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BrainDeletionResult"}
        "400": {description: Confirmation required}
        "401": {description: Sign in required}
        "503": {description: Partial cleanup failed; retry safely}
  /memories:
    get:
      operationId: listMemories
      parameters:
        - {name: type, in: query, schema: {type: string}}
        - {name: search, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [confirmed, needs_review]}}
      responses:
        "200":
          description: Memories
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Memory"}}
    post:
      operationId: createMemory
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MemoryInput"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Memory"}
  /memories/samples:
    delete:
      operationId: deleteSampleMemories
      responses:
        "204": {description: Removed own sample memories}
  /memories/stats:
    get:
      operationId: getMemoryStats
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemoryStats"}
  /memories/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      operationId: getMemory
      responses:
        "200":
          description: Memory
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Memory"}
    patch:
      operationId: updateMemory
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MemoryUpdate"}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Memory"}
    delete:
      operationId: deleteMemory
      responses:
        "204": {description: Deleted}
  /memories/{id}/calendar:
    get:
      operationId: downloadMemoryCalendar
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Calendar event
          content:
            text/calendar:
              schema: {type: string}
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UploadUrlRequest"}
      responses:
        "200":
          description: Upload URL
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UploadUrlResponse"}
  /auth/signup:
    post:
      operationId: signUp
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SignUpInput"}
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthResult"}
  /auth/login:
    post:
      operationId: logIn
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LoginInput"}
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthResult"}
  /auth/logout:
    post:
      operationId: logOut
      responses:
        "204": {description: Signed out}
  /auth/me:
    get:
      operationId: getAuthMe
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthResult"}
        "401": {description: Sign in required}
  /auth/profile:
    patch:
      operationId: updateAuthProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProfileInput"}
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthResult"}
  /auth/password:
    post:
      operationId: changeAuthPassword
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasswordInput"}
      responses:
        "204": {description: Password changed}
  /auth/account:
    delete:
      operationId: deleteAuthAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AccountDeletionInput"}
      responses:
        "204": {description: Account and files deleted}
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    VoiceCaptureInput:
      type: object
      additionalProperties: false
      required: [audio_base64, mime_type, language, timezone]
      properties:
        audio_base64: {type: string, minLength: 4, maxLength: 6990508, description: "Canonical padded base64; decoded bytes must be at most 5242880."}
        mime_type: {type: string, description: "audio/webm, audio/ogg, audio/mp4, audio/mpeg or audio/wav; optional codecs parameter."}
        language: {type: string, enum: [en, ar]}
        timezone: {type: string, minLength: 1, maxLength: 100, description: "Valid IANA timezone."}
        keep_recording: {type: boolean, default: false}
    VoiceCaptureResult:
      type: object
      required: [transcript, memories]
      properties:
        transcript: {type: string}
        memories: {type: array, minItems: 1, items: {$ref: "#/components/schemas/Memory"}}
    VoiceCaptureError:
      type: object
      required: [error, code]
      properties:
        error: {type: string}
        code: {type: string}
        transcript: {type: string, description: "Only when speech was recovered; explicit user opt-in is required to save."}
    VoicePlainInput:
      type: object
      additionalProperties: false
      required: [transcript, language]
      properties:
        transcript: {type: string, minLength: 1, maxLength: 100000}
        language: {type: string, enum: [en, ar]}
    BrainQuestion:
      type: object
      additionalProperties: false
      required: [question, language]
      properties:
        question: {type: string, minLength: 1, maxLength: 2000}
        language: {type: string, enum: [en, ar]}
    BrainAnswer:
      type: object
      required: [answer, source_ids, sources]
      properties:
        answer: {type: string}
        source_ids: {type: array, items: {type: integer}}
        sources: {type: array, items: {$ref: "#/components/schemas/Memory"}}
    BrainExport:
      type: object
      required: [profile, memories, uploads]
      properties:
        profile: {$ref: "#/components/schemas/BrainProfile"}
        memories: {type: array, items: {$ref: "#/components/schemas/Memory"}}
        uploads: {type: array, items: {$ref: "#/components/schemas/BrainUpload"}}
    BrainProfile:
      type: object
      required: [id, email, name, language, theme, onboardingCompleted, createdAt, updatedAt]
      properties:
        id: {type: string}
        email: {type: string}
        name: {type: string}
        language: {type: string}
        theme: {type: string}
        onboardingCompleted: {type: boolean}
        createdAt: {type: string}
        updatedAt: {type: string}
    BrainUpload:
      type: object
      required: [path, name, size, contentType]
      properties:
        path: {type: string}
        name: {type: string}
        size: {type: integer}
        contentType: {type: string}
    BrainDeletion:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation: {type: string, enum: [DELETE]}
    BrainDeletionResult:
      type: object
      required: [deleted, scope]
      properties:
        deleted: {type: boolean}
        scope: {type: string}
    AuthUser:
      type: object
      required: [id, email, name, language, theme, onboardingCompleted]
      properties:
        id: {type: string}
        email: {type: string}
        name: {type: string}
        firstName: {type: string}
        lastName: {type: string}
        language: {type: string, enum: [en, ar]}
        theme: {type: string, enum: [system, light, dark]}
        onboardingCompleted: {type: boolean}
    AuthResult:
      type: object
      required: [user]
      properties:
        user: {$ref: "#/components/schemas/AuthUser"}
    SignUpInput:
      type: object
      additionalProperties: false
      required: [email, password, name, language, theme]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 8, maxLength: 72}
        name: {type: string, minLength: 1, maxLength: 120}
        language: {type: string, enum: [en, ar]}
        theme: {type: string, enum: [system, light, dark]}
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string}
        password: {type: string}
    ProfileInput:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 120}
        language: {type: string, enum: [en, ar]}
        theme: {type: string, enum: [system, light, dark]}
        onboardingCompleted: {type: boolean}
    PasswordInput:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string}
        newPassword: {type: string, minLength: 8, maxLength: 72}
    AccountDeletionInput:
      type: object
      additionalProperties: false
      required: [confirmation, password]
      properties:
        confirmation: {type: string, enum: [DELETE]}
        password: {type: string}
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: {type: string, minLength: 1, maxLength: 255}
        size: {type: integer, minimum: 1, maximum: 10485760}
        contentType: {type: string, enum: [image/jpeg, image/png, image/webp, image/heic, application/pdf]}
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: {type: string}
        objectPath: {type: string}
    MemoryType:
      type: string
      enum: [appointment, receipt, task, idea, document, note, other]
    MemoryStatus:
      type: string
      enum: [confirmed, needs_review]
    Memory:
      type: object
      required: [id, type, title, summary, raw_text, transcript, event_date, amount, currency, people, tags, confidence, status, file_path, created_at, is_sample]
      properties:
        id: {type: integer}
        is_sample: {type: boolean}
        type: {$ref: "#/components/schemas/MemoryType"}
        title: {type: string}
        summary: {type: [string, "null"]}
        raw_text: {type: string}
        transcript: {type: [string, "null"]}
        event_date: {type: [string, "null"]}
        amount: {type: [number, "null"]}
        currency: {type: [string, "null"]}
        people: {type: array, items: {type: string}}
        tags: {type: array, items: {type: string}}
        confidence: {type: integer}
        status: {$ref: "#/components/schemas/MemoryStatus"}
        file_path: {type: [string, "null"]}
        created_at: {type: string}
        extra:
          type: object
          additionalProperties: true
        extraction_status:
          type: string
          enum: [legacy, processing, extracted, fallback]
        extraction_error:
          type: [string, "null"]
          enum: [null, not_configured, unavailable, invalid_response, unsupported_file]
    MemoryInput:
      type: object
      required: [raw_text]
      properties:
        raw_text: {type: string, maxLength: 100000}
        title: {type: string, maxLength: 200}
        file_path: {type: [string, "null"]}
        language: {type: string, enum: [en, ar]}
        timezone: {type: string, maxLength: 100}
    MemoryUpdate:
      type: object
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        transcript: {type: [string, "null"], maxLength: 100000}
        raw_text: {type: string, maxLength: 100000}
        summary: {type: [string, "null"], maxLength: 5000}
        type: {$ref: "#/components/schemas/MemoryType"}
        status: {$ref: "#/components/schemas/MemoryStatus"}
        event_date: {type: [string, "null"]}
        amount: {type: [number, "null"], minimum: 0}
        currency: {type: [string, "null"], maxLength: 10}
        people: {type: array, items: {type: string}, maxItems: 50}
        tags: {type: array, items: {type: string}, maxItems: 50}
        extra:
          type: object
          additionalProperties: true
    MemoryStats:
      type: object
      required: [total, needs_review, confirmed]
      properties:
        total: {type: integer}
        needs_review: {type: integer}
        confirmed: {type: integer}
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

